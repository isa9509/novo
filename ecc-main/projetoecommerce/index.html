<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>
<body>
    <main class="container">
        <form action="#" method="post">
            <h1>Faça login</h1>
            <div class="input-box">
                <input placeholder="Usuário" type="email" 
                autocomplete="username" required></div>
            <div class="input-box">
                <input placeholder="Senha" type="password" nome="senha" id="senha"
                autocomplete="current-password">
            <i class='bx bx-hide toggle-senha' id="toggleSenha"></i>
        </div>
            
            <div>
                <label>
                <input type="checkbox">Manter-me logado
            </div>
            <button type="submit" classe="login">Entrar</button>
        </form>
        <script></script>
        
    </main>
</body>         
</html>
