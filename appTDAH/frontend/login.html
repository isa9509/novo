<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'> 
    <link rel="stylesheet" href="login.css">
    
</head>
<body>

    <div class="logo">
    <div class="peca peca1"> <img src="imagem/sup.esq.png" alt="peca1"> </div>
    <div class="peca peca2"> <img src="imagem/sup.inf.png" alt="peca2"> </div>
    <div class="peca peca3"><img src="imagem/inf.esq.png" alt="peca3"> </div>
    <div class="peca peca4"><img src="imagem/inf.dir.png" alt="peca4"> </div></div>
    </div>
    <form action="">
        <h1>Login</h1>
        <div class="input-box">
            <input type="text" placeholder="Usuário">
            <i class='bx bx-user'></i>
        </div>
        <div class="input-box">
            <input type="password" placeholder="Senha">
            <i class='bx bx-lock-alt'></i>
        </div>
        <div class="lembrar-senha">
            <label>
                <input type="checkbox">
                Lembrar minha senha
            </label>
            <a href="#">Esqueci minha senha</a>
        </div>
        <button type="submit">Entrar</button>
        <div class="registrar">
            <p>Não tem uma conta? <a href="#">Cadastre-se</a></p>
    </form>


    
</body>
